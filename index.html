<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Juegos de preguntas por equipos para la sala de clases: crea tus preguntas, arma los equipos y juega con tómbola, rebote y comodines.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2730%27%20fill%3D%27%23f5c44e%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2717%27%20fill%3D%27%2314121b%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2740%27%20font-family%3D%27Arial%27%20font-weight%3D%27700%27%20font-size%3D%2722%27%20text-anchor%3D%27middle%27%20fill%3D%27%23f5c44e%27%3E%3F%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tómbola de Repaso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>
/* Layout: biblioteca en grilla de tarjetas; editor con lista de preguntas a la izquierda y resumen a la derecha; juego con marcador arriba, pregunta a la izquierda y turno a la derecha (proyector). */
:root{
  /* Sala oscura para proyector, con los colores de la tómbola: amarillo de boleto, rojo y azul escolar; escarapelas de color para los equipos */
  --bg:#14121b; --panel:#1e1b28; --panel2:#29253a; --ink:#f4efe6; --muted:#b3abc0; --line:#3c3650;
  --accent:#f5c44e; --on-accent:#1d1404; --gold-soft:rgba(245,196,78,.13);
  --blue:#3f78e0; --red:#e04a3e;
  --ok:#5fd394; --on-ok:#05200f; --ok-soft:rgba(95,211,148,.14);
  --warn:#ffb547; --warn-soft:rgba(255,181,71,.14);
  --bad:#ff6157; --on-bad:#2a0503; --bad-soft:rgba(255,97,87,.13);
  --t0:#5b9dff; --t1:#ff7bb0; --t2:#31c7bf; --t3:#ff9d45; --t4:#b48cff; --t5:#c9a06e; --on-team:#15101b;
  --scrim:rgba(8,5,12,.78);
  --confetti:#f5c44e,#3f78e0,#e04a3e,#f4efe6,#5b9dff,#ff7bb0,#31c7bf;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html{font-size:clamp(15px, calc(0.5vw + 9.5px), 20px)}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);line-height:1.45;-webkit-font-smoothing:antialiased;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{max-width:1480px;margin:0 auto;padding-inline:clamp(0px,1.6vw,24px);padding-block:0 48px;display:flex;flex-direction:column;gap:18px}
.stripe{height:6px;background:linear-gradient(90deg,var(--accent) 0 33.33%,var(--red) 33.33% 66.66%,var(--blue) 66.66% 100%);border-radius:0 0 4px 4px}
h1,h2,h3,h4{margin:0}
.cock{flex:none;display:inline-block;width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle,var(--tc) 0 28%,var(--ink) 29% 50%,var(--tc) 51% 100%);box-shadow:0 0 0 1px rgba(0,0,0,.3)}

/* ---------- botones y campos ---------- */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:.75rem 1.2rem;font-weight:700;font-size:1rem;background:var(--accent);color:var(--on-accent);display:inline-flex;gap:.5rem;align-items:center;justify-content:center;text-align:center;text-decoration:none}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--accent)}
.btn.small{padding:.45rem .8rem;font-size:.85rem;border-radius:10px}
.btn.big{padding:1rem 2rem;font-size:1.15rem}
.btn.warn{background:var(--bad);color:var(--on-bad)}
.btn.danger-t{color:var(--bad)}
kbd{font-family:var(--f-body);font-size:.72em;padding:.05rem .35rem;border-radius:5px;border:1px solid currentColor;opacity:.75;font-weight:700}
textarea,input[type=number],input[type=text],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;width:100%}
textarea{resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
input[type=number]{width:5.5rem}
select{width:auto}
input:disabled,textarea:disabled{opacity:.6}
.example{font-size:.82rem;color:var(--muted);margin:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}

/* ---------- encabezado ---------- */
.top{display:flex;flex-direction:column;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{min-width:0;display:flex;flex-direction:column;gap:4px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.75rem;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.brand p{margin:0;color:var(--muted);font-size:.82rem}
.crumbs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.icon-btn{width:2.3rem;height:2.3rem;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn[aria-pressed="false"]{opacity:.5}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:.4em;font-size:.75rem;padding:.25rem .65rem;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad)}

/* ---------- biblioteca ---------- */
.lib-hero{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding-top:6px}
.lib-hero h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,5vw,3.4rem);line-height:1;letter-spacing:-.02em}
.lib-hero p{margin:.5rem 0 0;color:var(--muted);max-width:60ch}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.gcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gcard::after{content:"";position:absolute;right:16px;top:-1px;width:44px;height:10px;border-radius:0 0 8px 8px;background:var(--accent);opacity:.9}
.gcard .eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;margin:0;padding-right:56px;overflow-wrap:anywhere}
.gcard h3{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.gcard .meta{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px}
.gcard .row{margin-top:auto;padding-top:6px}
.gcard .more-menu{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px;border-top:1px dashed var(--line)}
.empty{border:2px dashed var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h3{font-family:var(--f-display);font-weight:800;font-size:1.4rem}
.notice{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:.88rem}
.helpgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.helpgrid .box p{margin:0;font-size:.92rem;color:var(--muted)}
.helpgrid h3{font-family:var(--f-display);font-weight:800;font-size:1.1rem}

/* ---------- editor ---------- */
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);gap:22px;align-items:start}
.ed-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.ed-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px;min-width:0}
.ed-meta{display:flex;flex-direction:column;gap:10px}
input.title-input{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,3.5vw,2.3rem);letter-spacing:-.01em;background:transparent;border:1px dashed transparent;padding:.2rem .4rem;margin-left:-.4rem}
input.title-input:hover{border-color:var(--line)}
.ed-meta-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:700}
.mini input{font-weight:400;font-size:.95rem}
.savestat{font-size:.82rem;color:var(--muted)}
.savestat.dirty,.savestat.saving{color:var(--accent)}
.savestat.err{color:var(--bad)}
.qlist{display:flex;flex-direction:column;gap:10px}
.qe{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0}
.qe.open{border-color:var(--accent)}
.qe-h{width:100%;display:grid;grid-template-columns:2rem minmax(0,1fr) auto 1.2rem;gap:12px;align-items:center;background:transparent;border:0;padding:12px 14px;text-align:left}
.qnum{width:2rem;height:2rem;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.95rem}
.qprev{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.qprev.empty-t{color:var(--muted);font-weight:400;font-style:italic}
.chev{color:var(--muted);transition:transform .2s}
.qe.open .chev{transform:rotate(180deg)}
.badge{font-size:.72rem;font-weight:700;padding:.18rem .55rem;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--bad-soft);color:var(--bad)}
.qe-b{padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:700;color:var(--muted)}
.fld small,.alts legend small{font-weight:400}
.fld textarea,.fld input{font-weight:400;color:var(--ink);font-size:1rem}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
details.more{border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
details.more summary{cursor:pointer;font-size:.85rem;font-weight:700;color:var(--muted)}
details.more[open]{display:flex;flex-direction:column;gap:10px}
details.more[open] summary{margin-bottom:4px}
.alts{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.alts legend{font-size:.82rem;font-weight:700;color:var(--muted);padding:0;margin-bottom:6px}
.alt{display:grid;grid-template-columns:auto minmax(0,1fr) 2.4rem;gap:4px 8px;align-items:center;padding:6px;border-radius:12px;border:2px solid transparent}
.alt.is-ans{border-color:var(--ok);background:var(--ok-soft)}
.pick{display:flex;align-items:center;gap:6px;cursor:pointer}
.pick input{width:1.15rem;height:1.15rem;accent-color:var(--ok);margin:0}
.pick span{width:2rem;height:2rem;border-radius:8px;display:grid;place-items:center;background:var(--panel2);font-family:var(--f-display);font-weight:800}
.alt.is-ans .pick span{background:var(--ok);color:var(--on-ok)}
.len{font-size:.72rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.len.long{color:var(--warn);font-weight:700}
.alt-note{grid-column:2/4;font-size:.86rem!important;padding:.35rem .6rem;border-style:dashed}
.issues{display:flex;flex-direction:column;gap:6px}
.issues:empty{display:none}
.issue{font-size:.86rem;padding:8px 12px;border-radius:10px}
.issue.err{background:var(--bad-soft);color:var(--bad)}
.issue.warn{background:var(--warn-soft);color:var(--warn)}
.qe-actions{border-top:1px solid var(--line);padding-top:12px}
.stat{font-size:.95rem}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.dist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end;height:104px}
.dist div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.dist i{width:100%;max-width:38px;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.dist span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.side-tools{display:flex;flex-direction:column;gap:8px}
.side-tools .btn{justify-content:flex-start}
pre.fmt{margin:0;white-space:pre-wrap;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.78rem;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);overflow-x:auto}

/* ---------- juego: marcador ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tcard{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:10px 14px;border-radius:14px;background:var(--panel);border:2px solid transparent;min-width:0;transition:background-color .3s,border-color .3s}
.tcard .tname{display:flex;align-items:center;gap:.5em;font-weight:700;font-size:.92rem;min-width:0}
.tcard .tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .tscore{grid-column:2;grid-row:1/span 2;font-family:var(--f-display);font-weight:800;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.tcard .tmeta{display:flex;align-items:center;gap:10px;font-size:.7rem;color:var(--muted);min-height:12px}
.dots3{display:flex;gap:3px}
.dots3 i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots3 i.on{background:var(--accent)}
.fcount{color:var(--bad);font-weight:700}
.tcard.cur{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 17%,var(--panel))}
.tcard .flag{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--on-team);background:var(--tc);border-radius:999px;padding:.08rem .5rem}
.tcard.bump .tscore{animation:bump .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1.35);color:var(--accent)}100%{transform:scale(1)}}

/* ---------- juego: preguntas ---------- */
.dots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{min-width:2.1rem;height:2.1rem;padding:0 .4rem;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted);box-shadow:inset 0 -4px 0 var(--tc)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.dot.half{border-color:var(--ok);color:var(--ok);border-width:2px}
.dot.bad{border-color:var(--bad);color:var(--bad);border-width:2px}
.dot.gold{border-color:var(--accent);border-width:2px}
.dot.gold:not(.ok){color:var(--accent)}
.dot.cur{outline:3px solid var(--accent);outline-offset:2px;color:var(--ink)}
.dot.ok.cur{color:var(--on-ok)}
.dot.fin{padding:0 .8rem;letter-spacing:.05em;text-transform:uppercase;font-size:.7rem;box-shadow:none;border-radius:8px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:22px;align-items:start}
.qcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.qcard{background:var(--panel);border:2px solid transparent;border-radius:18px;padding:clamp(18px,2.2vw,32px);display:flex;flex-direction:column;gap:18px;min-width:0}
.qcard.gold{border-color:var(--accent);box-shadow:0 0 0 5px var(--gold-soft),0 0 70px rgba(245,196,78,.12)}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.qn{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1;margin-right:4px}
.qn small{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.45em;font-size:.74rem;padding:.25rem .65rem;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.pts{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.pts.gold{background:var(--accent);color:var(--on-accent)}
.chip.own{color:var(--ink)}
.ctx,.hintbox{margin:0;padding:14px 18px;border-radius:12px;display:grid;gap:6px;min-width:0}
.ctx{background:var(--panel2)}
.hintbox{border:2px dashed var(--accent);background:var(--gold-soft)}
.clabel{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700}
.ctx q{quotes:"«" "»";font-style:italic;font-size:1.12rem;line-height:1.45;white-space:pre-line}
.ctx cite{font-style:normal;color:var(--muted);font-size:.84rem}
.hintbox p{margin:0;font-size:1.02rem}
.stem{font-size:1.38rem;line-height:1.38;margin:0;font-weight:700;text-wrap:pretty;white-space:pre-line}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:14px;align-items:start;text-align:left;padding:12px 16px 12px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:1.08rem;line-height:1.35;transition:border-color .15s,background .15s,opacity .2s,transform .15s}
.opt .L{width:2.6rem;height:2.6rem;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem;background:var(--panel2);color:var(--ink)}
.opt .txt{padding-top:.35rem;min-width:0;overflow-wrap:anywhere}
.opt .why-not{display:block;margin-top:6px;font-size:.86rem;color:var(--muted);line-height:1.35}
.opt .why-not b{color:var(--bad)}
.opt:not(:disabled):hover{border-color:var(--accent);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.is-out{opacity:.25;text-decoration:line-through}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-wrong .L{background:var(--bad);color:var(--on-bad)}
.opt.is-right{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-right .L{background:var(--ok);color:var(--on-ok)}
.fb{border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line)}
.fb.good{border:2px solid var(--ok);background:var(--ok-soft)}
.fb.bad{border:2px solid var(--bad);background:var(--bad-soft)}
.fb .verdict{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1.15;margin:0}
.fb p{margin:0;font-size:1.04rem;max-width:72ch}
.fb .kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.fb .hint{color:var(--muted)}
.fb .hint b{color:var(--ink)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.turn{background:var(--tc);border-color:transparent;color:var(--on-team);transition:background-color .12s}
.turn h2{color:var(--on-team);opacity:.8;font-size:.78rem}
.who{font-family:var(--f-display);font-weight:800;font-size:2.3rem;line-height:1.05;min-height:2.2em;display:flex;align-items:center;overflow-wrap:anywhere;color:var(--on-team)}
.who.wait{opacity:.55;font-size:1.5rem}
.who.land{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(.8)}100%{transform:scale(1)}}
.turn .sub{font-size:.82rem;margin:0;opacity:.8}
.btn.spin{width:100%;padding:1rem;font-size:1.08rem;background:var(--on-team);color:var(--tc)}

<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">
  <div class="stripe" aria-hidden="true"></div>
  <header class="top" id="top"></header>
  <main id="view"></main>

<div class="overlay" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="banner" id="banner" hidden></div>

<script>
/* =================== utilidades =================== */
const LET = ['A','B','C','D'];
const BASE = 100, RACHA = 50, RACHA_MAX = 2, MAXT = 6;
const TEAM_NAMES = ['Montesquieu','Olympe de Gouges','O’Higgins','Manuel Rodríguez','Voltaire','Carrera'];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const str = v => typeof v === 'string' ? v : (v == null ? '' : String(v));
const num = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n));
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const tcol = t => `var(--t${t})`;
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
const rid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const slug = s => (str(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40)) || 'juego';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch(e) {} };
function ago(iso){
  const t = Date.parse(iso); if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'recién'; if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24); if (d < 30) return `hace ${d} ${d === 1 ? 'día' : 'días'}`;
  return new Date(t).toLocaleDateString('es-CL');
}

/* =================== modelo de preguntas =================== */
function normQ(x){
  x = x || {}; const o = x.opts || {}, n = x.notes || {}, c = x.ctx || {};
  const q = { id: (typeof x.id === 'string' && /^[\w-]{1,40}$/.test(x.id)) ? x.id : 'q' + rid(), tema: str(x.tema), q: str(x.q),
    ctx: { text: str(c.text), cite: str(c.cite) }, opts: {}, notes: {}, ans: LET.includes(x.ans) ? x.ans : '', why: str(x.why), hint: str(x.hint) };
  LET.forEach(L => { q.opts[L] = str(o[L]); q.notes[L] = str(n[L]); });
  return q;
}
function normGame(id, d){
  d = d || {};
  return { id, title: str(d.title).trim() || 'Juego sin título', course: str(d.course), unit: str(d.unit),
    questions: Array.isArray(d.questions) ? d.questions.map(normQ) : [], createdAt: str(d.createdAt), updatedAt: str(d.updatedAt) };
}
function gameBody(g){
  return { title: g.title, course: g.course, unit: g.unit, createdAt: g.createdAt || new Date().toISOString(), updatedAt: g.updatedAt || new Date().toISOString(),
    questions: g.questions.map(q => ({ id: q.id, tema: q.tema, q: q.q, ctx: { text: q.ctx.text, cite: q.ctx.cite }, opts: Object.assign({}, q.opts), ans: q.ans, why: q.why, notes: Object.assign({}, q.notes), hint: q.hint })) };
}
const letters = q => LET.filter(L => q.opts[L].trim());
function qIssues(q){
  const out = [], ls = letters(q);
  if (!q.q.trim()) out.push({ lvl:'err', t:'Falta el enunciado.' });
  if (ls.length < 2) out.push({ lvl:'err', t:'Necesita al menos dos alternativas.' });
  if (!q.ans) out.push({ lvl:'err', t:'Marca cuál es la alternativa correcta.' });
  else if (!q.opts[q.ans].trim()) out.push({ lvl:'err', t:`La alternativa marcada como correcta (${q.ans}) está vacía.` });
  if (ls.length >= 2 && ls.join('') !== LET.slice(0, ls.length).join('')) out.push({ lvl:'warn', t:'Hay una alternativa vacía entre medio. Deja las vacías al final (por ejemplo, C y D).' });
  if (ls.length >= 2 && q.ans && q.opts[q.ans].trim()) {
    const others = ls.filter(L => L !== q.ans).map(L => q.opts[L].trim().length);
    const c = q.opts[q.ans].trim().length, avg = others.reduce((a, b) => a + b, 0) / others.length;
    if (c > Math.max(...others) && c > avg * 1.2 && c - avg >= 8) out.push({ lvl:'warn', t:`La correcta es bastante más larga que las demás (${c} caracteres; las otras promedian ${Math.round(avg)}). Se puede adivinar sin leer.` });
  }
  const seen = {};
  ls.forEach(L => { const k = q.opts[L].trim().toLowerCase(); if (seen[k]) out.push({ lvl:'warn', t:`Las alternativas ${seen[k]} y ${L} dicen lo mismo.` }); else seen[k] = L; });
  return out;
}
const playable = q => !qIssues(q).some(i => i.lvl === 'err');
const longWarn = q => qIssues(q).some(i => i.lvl === 'warn' && i.t.startsWith('La correcta es bastante'));

/* Formato para pegar desde Word o Docs */
const FORMAT_EXAMPLE = `1. ¿Quién propuso la separación de los poderes del Estado?
A) Rousseau
*B) Montesquieu
C) Voltaire
D) Olympe de Gouges
Explicación: Montesquieu la propuso en El espíritu de las leyes (1748).
Pista: Revisa la sección I.c de la guía.
Tema: La Ilustración

2. ¿En qué año se formó la Primera Junta Nacional de Gobierno?
A) 1808
*B) 1810
C) 1814
D) 1818`;
function parseText(text){
  const lines = str(text).replace(/\r/g, '').split('\n');
  const out = []; let cur = null, lastField = null;
  const start = () => { cur = normQ({}); cur._hasOpt = false; out.push(cur); lastField = 'q'; };
  const looksNew = l => /^(pregunta\s*)?\d+\s*[\.\)\-:]\s*\S/i.test(l) || /^¿/.test(l);
  for (const raw of lines) {
    const line = raw.replace(/\u00a0/g, ' ').trim();
    if (!line) { if (cur && (cur._hasOpt || lastField === 'why' || lastField === 'hint')) lastField = 'gap'; continue; }
    let m = line.match(/^(\*|✓|✔)?\s*\(?([A-Da-d])\s*[\)\.\-:]\s+(.+)$/);
    if (m && cur && lastField !== 'gap') {
      const L = m[2].toUpperCase(); let t = m[3].trim(); let ok = !!m[1];
      if (/(\s\*|\(correcta\)|✓|✔)$/i.test(t)) { ok = true; t = t.replace(/\s*(\*|\(correcta\)|✓|✔)$/i, '').trim(); }
      cur.opts[L] = t; cur._hasOpt = true; if (ok) cur.ans = L; lastField = 'opt'; continue;
    }
    m = line.match(/^(explicaci[oó]n|por qu[eé]|pista|tema|secci[oó]n|fuente|texto|cita|autor|respuesta|correcta|clave)\s*:\s*(.*)$/i);
    if (m) {
      const k = m[1].toLowerCase(), v = m[2].trim();
      const opener = k === 'fuente' || k === 'texto' || k === 'tema' || k.startsWith('secci');
      if (!cur || (opener && lastField === 'gap')) start();
      if (k.startsWith('explic') || k.startsWith('por qu')) { cur.why = v; lastField = 'why'; }
      else if (k === 'pista') { cur.hint = v; lastField = 'hint'; }
      else if (k === 'tema' || k.startsWith('secci')) { cur.tema = v; lastField = cur._hasOpt ? 'meta' : 'q'; }
      else if (k === 'fuente' || k === 'texto') { cur.ctx.text = v; lastField = 'ctx'; }
      else if (k === 'cita' || k === 'autor') { cur.ctx.cite = v; lastField = cur._hasOpt ? 'meta' : 'q'; }
      else { const L = (v.match(/[A-Da-d]/) || [''])[0].toUpperCase(); if (L) cur.ans = L; lastField = 'meta'; }
      continue;
    }
    // continuación de una explicación, pista o fuente
    if (cur && (lastField === 'why' || lastField === 'hint') && !looksNew(line)) { cur[lastField] += ' ' + line; continue; }
    if (cur && lastField === 'ctx' && !cur._hasOpt) { cur.ctx.text += '\n' + line; continue; }
    // texto libre: enunciado nuevo o su continuación
    if (!cur || cur._hasOpt || lastField === 'gap') start();
    const clean = !cur.q ? line.replace(/^(pregunta\s*)?\d+\s*[\.\)\-:]\s*/i, '') : line;
    cur.q = cur.q ? cur.q + '\n' + clean : clean; lastField = 'q';
  }
  return out.map(q => { delete q._hasOpt; return q; }).filter(q => q.q.trim() || letters(q).length);
}

/* =================== almacenamiento =================== */
const LOCAL_KEY = 'tombola:juegos';
const Store = {
  mode: 'loading', db: null, games: [], builtin: [], readOnly: false, error: '', queues: {},
  async loadBuiltin(){
    // Juegos incluidos: archivos .json en la carpeta juegos/ junto a la página (por ejemplo, en GitHub Pages)
    if (IN_CLAUDE || !/^https?:$/.test(location.protocol)) return;
    try {
      const r = await fetch('juegos/index.json', { cache: 'no-cache' }); if (!r.ok) return;
      const list = await r.json(); if (!Array.isArray(list)) return;
      const out = [];
      for (const item of list) {
        const file = typeof item === 'string' ? item : (item && item.archivo);
        if (!file || !/^[\w.-]+\.json$/.test(file)) continue;
        try { const rr = await fetch('juegos/' + file, { cache: 'no-cache' }); if (!rr.ok) continue; const d = await rr.json(); if (d && Array.isArray(d.questions)) { const g = normGame('inc-' + file.replace(/\.json$/, ''), d); g.builtin = true; out.push(g); } } catch(e) {}
      }
      this.builtin = out; onStoreChange();
    } catch(e) {}
  },
  async init(){
    let db = null;
    try { db = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('db') : null; } catch(e) { db = null; }
    if (db) {
      this.db = db; this.mode = 'db';
      try { const u = await window.claude.use('user'); if (u) { const w = await u.can('data.write'); if (w === false) this.readOnly = true; } } catch(e) {}
      try {
        db.collection('juegos').onSnapshot(snap => {
          this.games = snap.docs.map(d => normGame(d.id, d.data())); this.error = ''; onStoreChange();
        }, err => { this.error = (err && err.code) || 'unavailable'; onStoreChange(); });
      } catch(e) { this.error = 'unavailable'; onStoreChange(); }
    } else {
      this.mode = 'local';
      const raw = lsGet(LOCAL_KEY) || {};
      this.games = Object.keys(raw).map(id => normGame(id, raw[id]));
      onStoreChange();
    }
  },
  persistLocal(){ const o = {}; this.games.forEach(g => o[g.id] = gameBody(g)); lsSet(LOCAL_KEY, o); },
  get(id){ return this.games.find(g => g.id === id) || this.builtin.find(g => g.id === id) || null; },
  save(g){
    g.updatedAt = new Date().toISOString(); if (!g.createdAt) g.createdAt = g.updatedAt;
    const body = gameBody(g);
    if (this.mode !== 'db') {
      const i = this.games.findIndex(x => x.id === g.id), copy = normGame(g.id, body);
      if (i >= 0) this.games[i] = copy; else this.games.push(copy);
      this.persistLocal(); onStoreChange(); return Promise.resolve();
    }
    const prev = this.queues[g.id] || Promise.resolve();
    const p = prev.catch(() => {}).then(() => this.db.collection('juegos').doc(g.id).set(body));
    this.queues[g.id] = p; return p;
  },
  remove(id){
    if (this.mode !== 'db') { this.games = this.games.filter(g => g.id !== id); this.persistLocal(); onStoreChange(); return Promise.resolve(); }
    const prev = this.queues[id] || Promise.resolve();
    const p = prev.catch(() => {}).then(() => this.db.collection('juegos').doc(id).delete());
    this.queues[id] = p; return p;
  }
};

}

  if (extra) cols = cols.concat(extra, extra, extra);
  for (let i = 0; i < n; i++) parts.push({ x: W * (.25 + Math.random() * .5), y: H * .42, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5, r: Math.random() * 7 + 5, c: cols[i % cols.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .35 });
  if (!raf) loop();
}

}
const teamHex = t => getComputedStyle(document.documentElement).getPropertyValue('--t' + t).trim();

/* =================== juego: tómbola y respuestas =================== */
let spinning = false;
function pool(t){
  const m = members(t); if (!C.noRepeat) return m;
  let p = m.filter(n => !S.used.includes(n));
  if (!p.length) { S.used = S.used.filter(n => !m.includes(n)); toast(S.T === 1 ? 'Todo el curso ya participó. Vuelven a entrar todos a la tómbola.' : `Todo el equipo ${teamName(t)} ya participó. Vuelven a entrar todos a la tómbola.`); p = m.slice(); }

}
function spin(){
  if (VIEW !== 'play' || spinning || S.phase !== 'draw') return;
  const t = S.cur.team, m = members(t);
  if (!m.length) { openSettings(); toast(`El equipo ${teamName(t)} no tiene integrantes. Agrégalos en Equipos y ajustes.`, 'bad'); return; }
  const p = pool(t);
  let cand = p.filter(n => !S.cur.picks.some(k => k.s === n)); if (!cand.length) cand = p;
  const final = cand[Math.floor(Math.random() * cand.length)];
  spinning = true; render();
  const el = $('#who'); el.classList.remove('wait', 'land');
  let d = 45;
  const step = () => { if (d > 330 || reduceMotion()) return done(); el.textContent = m[Math.floor(Math.random() * m.length)]; SFX.tick(); d *= 1.11; setTimeout(step, d); };
  function done(){
    spinning = false; S.cur.student = final;
    if (C.noRepeat && !S.used.includes(final)) S.used.push(final);
    S.phase = 'answer'; save(); SFX.pick(); render();
    const w = $('#who'); if (w) w.classList.add('land');
  }
  step();
}
function answer(L){
  if (VIEW !== 'play' || spinning || S.phase !== 'answer') return;
  const q = D.questions[S.qi], c = S.cur, t = c.team;
  if (!q.opts[L] || c.hidden.includes(L) || c.picks.some(p => p.l === L)) return;
  c.picks.push({ s: c.student, t, l: L });
  stopWhisper();
  const mult = isGold(S.qi) ? 2 : 1;
  if (L === q.ans) {
    const pts = (c.attempt === 1 ? BASE : BASE / 2) * mult;
    S.results[S.qi] = { status: c.attempt === 1 ? 'correct' : 'rebote', pts, team: t, gold: mult === 2, picks: c.picks.slice() };
    S.streak[t]++; S.phase = 'revealed';
    SFX.ok(); burst(mult === 2 ? 200 : 120, teamHex(t));
    if (S.streak[t] % 3 === 0 && S.bonus[t] < RACHA * RACHA_MAX) {
      S.bonus[t] += RACHA;
      setTimeout(() => { SFX.fanfare(); banner('Racha de tres aciertos', S.T === 1 ? 'Todo el curso' : teamName(t), `+${RACHA} puntos extra`); if (VIEW === 'play') renderBoard(); }, 900);
    }
    save(); render();
  } else {
    S.streak[t] = 0; SFX.bad(); flash();
    const remaining = qL(q).filter(x => !c.hidden.includes(x) && !c.picks.some(p => p.l === x));
    if (c.attempt === 1 && remaining.length >= 2) S.phase = 'wrong';
    else { S.results[S.qi] = { status:'wrong', pts:0, team:null, gold: mult === 2, picks: c.picks.slice() }; S.phase = 'revealed'; }
    save(); render();
  }
}
function rebote(){
  if (VIEW !== 'play' || S.phase !== 'wrong' || spinning) return;
  const from = S.cur.team;
  const others = S.T === 1 ? [0] : teamIdx().filter(t => t !== from && members(t).length);
  if (!others.length) { toast('No hay otro equipo con integrantes para el rebote.'); return; }
  const target = others[Math.floor(Math.random() * others.length)];
  stopWhisper();
  Object.assign(S.cur, { attempt:2, team:target, student:null, whisper:false, fifty:false });
  S.phase = 'draw';
  if (S.T === 1) { save(); render(); spin(); return; }
  spinning = true; render();
  const box = $('#turnBox'), lab = $('#turnTeam'), who = $('#who');
  who.classList.remove('wait'); who.textContent = '¿Quién rebota?';
  let d = 70, k = Math.floor(Math.random() * others.length);
  const step = () => {
    if (d > 380 || reduceMotion()) return land();
    const tt = others[k++ % others.length];
    box.style.setProperty('--tc', tcol(tt)); lab.textContent = 'Rebote · Equipo ' + teamName(tt); SFX.tick(); d *= 1.16; setTimeout(step, d);
  };
  function land(){ spinning = false; SFX.pick(); save(); render(); setTimeout(spin, reduceMotion() ? 0 : 550); }

}
function reveal(){
  if (VIEW !== 'play' || S.phase !== 'wrong' || spinning) return;

}
function goTo(i){

  const newGold = !S.results[i] && isGold(i) && !S.goldSeen.includes(i);
  if (newGold) S.goldSeen.push(i);
  save(); render(); window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
  if (newGold) { SFX.gold(); burst(90); banner('¡Pregunta de oro!', 'Vale el doble', `${S.T === 1 ? 'El curso' : teamName(owner(i))} puede ganar ${BASE * 2} puntos`); }
}
function next(){ if (S.qi < N - 1) goTo(S.qi + 1); else showFinal(); }
function showFinal(){
  if (spinning) return; stopWhisper(); hideBanner(); S.phase = 'final'; save(); render();

function fifty(){

  if (wrong.length < 2) { toast('Solo queda una alternativa incorrecta: el 50/50 no ayuda aquí.'); return; }

function syncTeams(){ for (let i = 0; i < draft.T; i++) { const n = $('#tn' + i), m = $('#tm' + i); if (n) draft.names[i] = n.value; if (m) draft.members[i] = m.value; } }

      <div class="box"><h3>Comodines y sorpresas</h3><ul class="perks">
        <li><b>50/50</b> elimina alternativas incorrectas.</li>
        <li><b>Susurro</b>: 30 segundos para consultar en voz baja${solo ? ' con el compañero de puesto' : ' con su equipo'}.</li>
        <li><b>Pista</b> muestra dónde buscar la respuesta.</li>
        <li><b>Pregunta de oro</b>: ${solo ? 'hay dos escondidas' : 'cada equipo tiene una escondida en sus turnos'}. Vale el doble.</li>
      </ul><p class="example">${solo ? 'El curso tiene' : 'Cada equipo tiene'} ${C.lives === 1 ? 'un uso' : C.lives + ' usos'} de cada comodín. Se usan antes de responder.</p></div>
      <div class="box warnbox"><h3>Reglas de convivencia</h3><ul class="rules"><li>${ICON_SHOUT}No gritar</li><li>${ICON_SEAT}No pararse del asiento</li></ul>
        <p>Cada falta descuenta <b>${C.penalty} puntos</b>${solo ? ' al curso' : ' al equipo'}. ${freeTxt()}</p></div>
    </div>`;
}
function renderDots(){
  $('#dots').innerHTML = D.questions.map((q, i) => {
    const r = S.results[i];
    const cls = r ? (r.status === 'correct' ? 'ok' : r.status === 'rebote' ? 'half' : 'bad') : '';
    const g = isGold(i) && (S.goldSeen.includes(i) || r) ? ' gold' : '';
    return `<button class="dot ${cls}${g} ${i === S.qi ? 'cur' : ''}" style="--tc:${S.T === 1 ? 'transparent' : tcol(owner(i))}" data-act="goto" data-v="${i}" aria-label="Pregunta ${i + 1}${S.T > 1 ? ', turno de ' + esc(teamName(owner(i))) : ''}${g ? ', pregunta de oro' : ''}">${i + 1}</button>`;
  }).join('') + `<button class="dot fin" data-act="final">Resultados</button>`;
}
function renderQ(){
  const q = D.questions[S.qi], r = S.results[S.qi], c = S.cur, ph = S.phase, own = owner(S.qi);
  const gold = isGold(S.qi), value = BASE * (gold ? 2 : 1), revealed = ph === 'revealed';
  const picks = r ? r.picks : c.picks, canAnswer = ph === 'answer' && !spinning;
  const opts = qL(q).map(L => {
    const cls = [], wrongPick = picks.some(p => p.l === L) && L !== q.ans;
    if (!revealed && c.hidden.includes(L)) cls.push('is-out');
    if (wrongPick) cls.push('is-wrong');
    if (revealed && L === q.ans) cls.push('is-right');
    const note = revealed && L !== q.ans && q.notes[L] ? `<span class="why-not"><b>Por qué no:</b> ${esc(q.notes[L])}</span>` : '';
    const dis = !canAnswer || c.hidden.includes(L) || wrongPick;
    return `<button class="opt ${cls.join(' ')}" data-act="answer" data-v="${L}" ${dis ? 'disabled' : ''}><span class="L">${L}</span><span class="txt">${esc(q.opts[L])}${note}</span></button>`;
  }).join('');
  let fb = '';
  const tn = esc(S.T === 1 ? 'el curso' : teamName(c.team)), keyRange = `${qL(q)[0]}–${qL(q)[qL(q).length - 1]}`;
  if (ph === 'draw') {
    fb = `<div class="fb"><p class="hint">${c.attempt === 2 ? `<b>Rebote${S.T === 1 ? '' : ' para ' + tn}.</b> Si acierta, gana ${value / 2} puntos.` : (S.T === 1 ? 'Lean la pregunta en silencio mientras sorteamos quién responde.' : `Turno de <b>${tn}</b>. Lean la pregunta en silencio mientras sorteamos quién responde.`)} Presiona <kbd>S</kbd> o <b>Sortear</b>.</p></div>`;
  } else if (ph === 'answer') {
    fb = `<div class="fb"><p class="hint">Responde <b>${esc(c.student || '')}</b>${S.T === 1 ? '' : ` (${tn})`}, desde su asiento y en voz normal. Antes de responder puede usar un comodín. Marca la alternativa que diga (teclas ${keyRange}).</p></div>`;
  } else if (ph === 'wrong') {
    const L = c.picks[c.picks.length - 1].l;
    fb = `<div class="fb bad"><p class="verdict">La ${L} no es correcta</p>${q.notes[L] ? `<p>${esc(q.notes[L])}</p>` : ''}
      <div class="row"><button class="btn" data-act="rebote">${S.T === 1 ? 'Rebote a otra persona' : 'Rebote a otro equipo'} (vale ${value / 2}) <kbd>R</kbd></button><button class="btn ghost" data-act="reveal">Ver la respuesta correcta</button></div></div>`;
  } else if (revealed && r) {
    const last = r.picks[r.picks.length - 1], name = last ? esc(last.s) : '';
    const to = S.T === 1 ? 'para el curso' : 'para ' + esc(teamName(r.team));
    let verdict, cls;
    if (r.status === 'correct') { verdict = `¡Correcto${name ? ', ' + name : ''}! +${r.pts} ${to}`; cls = 'good'; }
    else if (r.status === 'rebote') { verdict = `¡Rebote ganado${name ? ' por ' + name : ''}! +${r.pts} ${to}`; cls = 'good'; }
    else { verdict = `Nadie suma esta vez. Era la ${q.ans}`; cls = 'bad'; }
    fb = `<div class="fb ${cls}"><p class="verdict">${verdict}</p>${q.why ? `<span class="kicker">Por qué es la ${q.ans}</span><p>${esc(q.why)}</p>` : ''}
      <div class="row"><button class="btn" data-act="next">${S.qi < N - 1 ? 'Siguiente pregunta' : 'Ver resultados'} <kbd>Enter</kbd></button></div></div>`;
  }
  const hintBox = c.hint && !revealed && q.hint ? `<div class="hintbox"><span class="clabel">Pista</span><p>${esc(q.hint)}</p></div>` : '';
  const qc = $('#qcard'); qc.className = 'qcard' + (gold ? ' gold' : '');
  qc.innerHTML = `
    <div class="qmeta">
      <span class="qn">Pregunta ${S.qi + 1}<small> de ${N}</small></span>
      ${q.tema ? `<span class="chip">${esc(q.tema)}</span>` : ''}
      ${S.T > 1 ? `<span class="chip own" style="--tc:${tcol(own)}"><span class="cock"></span>Turno de ${esc(teamName(own))}</span>` : ''}
      <span class="chip pts ${gold ? 'gold' : ''}">${gold ? 'Pregunta de oro · ' : ''}${value} puntos</span>
    </div>
    ${q.ctx ? `<blockquote class="ctx"><span class="clabel">Fuente</span><q>${esc(q.ctx.text)}</q>${q.ctx.cite ? `<cite>${esc(q.ctx.cite)}</cite>` : ''}</blockquote>` : ''}
    <p class="stem">${esc(q.q)}</p>
    ${hintBox}
    <div class="opts">${opts}</div>
    ${fb}`;
}
function renderSide(){
  const ph = S.phase, c = S.cur, r = S.results[S.qi];
  let t = c.team, name = c.student;
  let label = S.T === 1 ? (c.attempt === 2 ? 'Rebote · responde' : 'Responde') : (c.attempt === 2 ? 'Rebote · ' : '') + 'Equipo ' + teamName(t);
  if (ph === 'revealed' && r && r.picks.length) { const last = r.picks[r.picks.length - 1]; name = last.s; t = last.t; const reb = r.status === 'rebote' || (r.status === 'wrong' && r.picks.length > 1); label = S.T === 1 ? (reb ? 'Rebote · respondió' : 'Respondió') : (reb ? 'Rebote · ' : '') + 'Equipo ' + teamName(t); }
  const m = members(t), left = m.filter(n => !S.used.includes(n)).length;
  const L = S.life[c.team], canLife = ph === 'answer' && !spinning, q = D.questions[S.qi];
  const whisperBox = wT ? `<div class="timer"><b id="wLeft">${wLeft}</b><span>Consulta en voz baja${S.T === 1 ? ' con el compañero de puesto' : ' con tu equipo'}, sin pararse y sin gritar.</span></div>` : '';
  const lf = (act, title, desc, n, used, extra = true) => `<button class="lf" data-act="${act}" ${canLife && n > 0 && !used && extra ? '' : 'disabled'}><strong>${title}</strong><span>${desc}</span>${dots3(n, C.lives)}</button>`;
  $('#side').innerHTML = `
    <div class="box turn" id="turnBox" style="--tc:${tcol(t)}">
      <h2 id="turnTeam">${esc(label)}</h2>
      <div class="who ${name || spinning ? '' : 'wait'}" id="who">${name ? esc(name) : (spinning ? '' : '¿Quién responde?')}</div>
      ${whisperBox}
      <button class="btn spin" data-act="spin" ${ph === 'draw' && !spinning ? '' : 'disabled'}>${spinning ? 'Sorteando…' : 'Sortear'} <kbd>S</kbd></button>
      <p class="sub">${C.noRepeat ? `Faltan ${left} de ${m.length} por participar${S.T === 1 ? '' : ' en este equipo'}.` : `${m.length} integrantes.`}</p>
    </div>
    <div class="box">
      <h2>Comodines${S.T === 1 ? ' del curso' : ' de ' + esc(teamName(c.team))}</h2>
      <div class="life">
        ${lf('fifty', '50/50', 'Elimina alternativas incorrectas', L.fifty, c.fifty, qL(q).length > 2)}
        ${lf('whisper', 'Susurro', S.T === 1 ? '30 s para consultar con el compañero' : '30 s para consultar con el equipo', L.whisper, c.whisper)}
        ${lf('hint', 'Pista', q.hint ? 'Muestra dónde buscar la respuesta' : 'Esta pregunta no tiene pista', L.hint, c.hint, !!q.hint)}
      </div>
    </div>
    <div class="box conduct">
      <h2>Reglas de convivencia</h2>
      <ul class="rules"><li>${ICON_SHOUT}No gritar</li><li>${ICON_SEAT}No pararse del asiento</li></ul>
      <small>Registrar una falta${S.T === 1 ? '' : ' para'}:</small>
      <div class="fbtns">${teamIdx().map(tt => `<button class="fbtn" data-act="falta" data-v="${tt}" style="--tc:${tcol(tt)}" aria-label="Registrar falta para ${esc(teamName(tt))}"><span class="cock"></span><span class="fn">${esc(teamName(tt))}</span><b>${faltasOf(tt)}</b></button>`).join('')}</div>
      <small>${freeTxt()} ${C.free ? 'Después, cada' : 'Cada'} falta descuenta ${C.penalty} puntos.</small>
      ${S.faltas.length ? '<button class="linkish" data-act="undo">Quitar la última falta</button>' : ''}
    </div>
    <p class="keys">Teclado: <kbd>S</kbd> sortear · <kbd>A</kbd>–<kbd>D</kbd> responder · <kbd>R</kbd> rebote · <kbd>Enter</kbd> siguiente · <kbd>←</kbd> <kbd>→</kbd> moverse</p>`;
}
function renderFinal(){
  const rows = standings(), pending = S.results.filter(r => !r).length, solo = S.T === 1;
  const winners = rows.filter(r => r.place === 1);
  const title = solo ? `${num(rows[0].score)} puntos` : (winners.length === 1 ? `Gana ${winners[0].name}` : `Empate: ${winners.map(w => w.name).join(' y ')}`);
  const onPod = rows.filter(r => r.place <= 3);
  const podiumOrder = [...onPod.filter(r => r.place === 2), ...onPod.filter(r => r.place === 1), ...onPod.filter(r => r.place === 3)];
  const hgt = p => p === 1 ? 100 : p === 2 ? 72 : 50;
  const names = [...new Set(S.results.flatMap(r => r ? r.picks.map(p => p.s) : []))];
  $('#final').innerHTML = `
    <div class="hero">
      <p class="eyebrow">${esc(['Resultados', D.course, D.unit].filter(Boolean).join(' · '))}</p>
      <h2>${esc(title)}</h2>
      <p class="lead">${N - pending} de ${N} preguntas jugadas${pending ? `; quedan ${pending} sin responder` : ''}. ${solo ? 'Ese es el puntaje que reunió todo el curso.' : (winners.length === 1 ? `${esc(winners[0].name)} terminó con ${num(winners[0].score)} puntos.` : `Terminaron con ${num(winners[0].score)} puntos cada uno.`)}</p>
    </div>
    ${solo ? '' : `<div class="podium" aria-label="Podio">${podiumOrder.map(r => `<div class="pod" style="--tc:${tcol(r.t)}"><span class="pname"><span class="cock"></span><span>${esc(r.name)}</span></span><div class="bar" style="height:${hgt(r.place) * .78}%"><span class="place">${r.place}°</span><span class="ppts">${num(r.score)}</span></div></div>`).join('')}</div>`}
    <div class="tbl"><table>
      <thead><tr><th>${solo ? 'Curso' : 'Equipo'}</th><th>Aciertos</th><th>Rebotes ganados</th><th>Preguntas de oro</th><th>Racha</th><th>Faltas</th><th>Total</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><span class="tn" style="--tc:${tcol(r.t)}"><span class="cock"></span>${solo ? '' : r.place + '° '}${esc(r.name)}</span></td><td>${r.ok}</td><td>${r.reb}</td><td>${r.gold}</td><td>${r.bonus ? '+' + r.bonus : '0'}</td><td>${r.faltas}${r.pen ? ` <span class="neg">(−${r.pen})</span>` : ''}</td><td class="total">${num(r.score)}</td></tr>`).join('')}</tbody>
    </table></div>
    ${names.length ? `<div class="box"><h2>Participaron (${names.length})</h2><div class="names">${names.map(n => `<span>${esc(n)}</span>`).join('')}</div></div>` : ''}
    <div class="row"><button class="btn" data-act="back">Volver a las preguntas</button><button class="btn ghost" data-act="settings">Equipos, ajustes o reiniciar</button><button class="btn ghost" data-act="toLibrary">Ir a la biblioteca</button></div>`;
}
function render(){
  if (VIEW !== 'play') return;
  renderHeader();
  const ph = S.phase;
  $('#intro').hidden = ph !== 'intro';
  $('#game').hidden = ph === 'intro' || ph === 'final';
  $('#final').hidden = ph !== 'final';
  if (ph === 'intro') renderIntro();
  else if (ph === 'final') renderFinal();
  else {
    renderDots(); renderQ();
    if (spinning) { const keep = $('#who') ? $('#who').textContent : ''; renderSide(); $('#who').textContent = keep; $('#who').classList.remove('wait'); }
    else renderSide();
  }
}

/* =================== eventos =================== */
const ACTIONS = {
  // biblioteca y editor
  newGame, copyBuiltin: v => copyBuiltin(v), editGame: v => openEditor(v), playGame: v => playGame(v), dupGame: v => dupGame(v), exportGame: v => exportGame(v),
  libMore: v => { LIB.more = LIB.more === v && !LIB.del ? null : v; LIB.del = null; renderLibrary(); },
  delGame: v => { LIB.more = v; LIB.del = v; renderLibrary(); }, delGameYes: v => delGame(v),
  toLibrary, qtoggle: v => qToggle(v), addQ, qmove: v => qMove(v), qdup: v => qDup(v), qdel: v => qDel(v), qdelYes: v => qDelYes(v), qdelNo: v => qDelNo(v),
  edDel: () => { $('#edDel').innerHTML = `<strong>¿Eliminar este juego para siempre?</strong> <button class="btn warn small" data-act="edDelYes">Sí, eliminar</button> <button class="btn ghost small" data-act="edDelNo">No</button>`; },
  edDelYes: () => { const id = ED.game.id; clearTimeout(saveT); saveState = 'saved'; delGame(id); },
  edDelNo: () => renderEdSide(),
  openImport: v => openImport(v), doImport, openAI, aiGo, aiStop, aiAdd, closeModal,
  copyExport: () => { const t = $('#expText'); try { navigator.clipboard.writeText(t.value).then(() => toast('Copiado'), () => { t.select(); toast('Selecciona y copia con Ctrl+C'); }); } catch(e) { t.select(); toast('Selecciona y copia con Ctrl+C'); } },
  // juego
  start, spin, rebote, reveal, next, fifty, whisper, hint: useHint,
  answer: v => answer(v), goto: v => goTo(+v), falta: v => falta(v),
  final: showFinal, back: () => goTo(S.qi), undo: undoFalta,
  settings: openSettings, saveSettings, gen: genRoster, deal, listSave, listLoad, listDel,
  reset: askReset, resetYes: doReset, resetNo,
  sound: toggleSound, fs: fullscreen,
  rules: () => { if (spinning) return; stopWhisper(); S.phase = 'intro'; save(); render(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (VIEW === 'play') ac();
  const fn = ACTIONS[b.dataset.act]; if (fn) fn(b.dataset.v);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#view').addEventListener('input', e => {
  if (VIEW !== 'editor' || !ED || Store.readOnly) return;
  const t = e.target;
  if (t.dataset.g) { ED.game[t.dataset.g] = t.value; markDirty(); return; }
  const f = t.dataset.f; if (!f) return;
  const card = t.closest('.qe'); if (!card) return;
  const q = edQ(card.dataset.id); if (!q) return;
  setField(q, f, t.value);
  if (f === 'ans') {
    card.querySelectorAll('.alt').forEach(a => { const on = a.dataset.l === q.ans; a.classList.toggle('is-ans', on); const nt = a.querySelector('.alt-note'); if (nt) nt.hidden = on; });
  }
  refreshCard(q); markDirty();
});
document.addEventListener('keydown', e => {
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (VIEW !== 'play') return;
  if (e.target.matches && e.target.matches('input, textarea, select')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (S.phase === 'intro') { if (k === 'enter') { e.preventDefault(); start(); } return; }
  if (S.phase === 'final') return;
  if (['a','b','c','d'].includes(k)) { ac(); answer(k.toUpperCase()); }
  else if (k === 's' || k === ' ') { e.preventDefault(); ac(); spin(); }
  else if (k === 'enter' || k === 'n') { if (S.phase === 'revealed') { e.preventDefault(); next(); } }
  else if (k === 'r') rebote();
  else if (k === 'arrowright') goTo(S.qi + 1);
  else if (k === 'arrowleft') goTo(S.qi - 1);
});
window.addEventListener('resize', () => { if (raf) sizeFx(); });
window.addEventListener('pagehide', () => { if (VIEW === 'editor') flushSave(); });

/* =================== inicio =================== */
renderLibrary();
Store.init();
Store.loadBuiltin();
(async () => {
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  try { CAP.sample = await window.claude.use('sample'); } catch(e) { CAP.sample = null; }
  try { CAP.downloads = await window.claude.use('downloads'); } catch(e) { CAP.downloads = null; }
  if (VIEW === 'editor') renderEdSide();
})();
</script>
</body>
</html>
